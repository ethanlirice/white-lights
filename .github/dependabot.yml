version: 2
updates:
  # Python: pyproject.toml's pinned/floor versions (cv, api, dev extras).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # JS: dev-only tooling (Vitest) — nothing here ships to the browser, but a
  # stale test runner still accumulates the same unpatched-CVE risk as any
  # other dependency tree.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # The Actions themselves (checkout, setup-python, setup-node, Pages deploy).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
