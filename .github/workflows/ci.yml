name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (light deps only — no torch/opencv needed for lint+tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

  # Separate job, not a step tacked onto lint-and-test: this is a different
  # runtime with its own dependency graph, and a failure here means "the pure
  # frontend logic broke," not "the backend broke" — worth being able to tell
  # apart from the status page without opening the log.
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test
