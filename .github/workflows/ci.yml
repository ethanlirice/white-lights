name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (light deps only — no torch/opencv needed for lint+tests)
        run: |
          # setuptools explicitly, not just pip: `--upgrade pip` does not
          # upgrade it, and actions/setup-python's runner image ships one old
          # enough to carry a since-disclosed CVE (PYSEC-2026-3447) — pip-audit
          # below exists to catch exactly this, so it needs a clean baseline.
          python -m pip install --upgrade pip setuptools
          pip install -e ".[api,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: pip-audit
        run: pip-audit

      - name: Pytest
        run: pytest

  # Separate job, not a step tacked onto lint-and-test: this is a different
  # runtime with its own dependency graph, and a failure here means "the pure
  # frontend logic broke," not "the backend broke" — worth being able to tell
  # apart from the status page without opening the log.
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test
